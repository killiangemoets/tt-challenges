# Backing services for the Second Brain build — Postgres+pgvector, MinIO, ElasticMQ.
# They start EMPTY: schema, buckets, and queues are yours to create (see STACK.md).
# Extend this file freely — add your app's services here, or run them on the host.

name: second-brain

services:
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    command: npm run dev
    environment:
      VITE_API_URL: http://localhost:${API_PORT:-3000}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./apps/frontend:/workspace/apps/frontend
      - frontend_node_modules:/workspace/node_modules
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:5173').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    command: npm run dev:api
    environment: &backend-environment
      NODE_ENV: development
      API_HOST: 0.0.0.0
      API_PORT: 3000
      APP_ALLOWED_ORIGINS: '["http://localhost:${FRONTEND_PORT:-5173}"]'
      DATABASE_URL: postgresql://brain:brain@db:5432/secondbrain
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minio-root
      MINIO_SECRET_KEY: minio-secret
      MINIO_BUCKET: documents
      SQS_ENDPOINT: http://queue:9324
      SQS_QUEUE_NAME: ingest
      AWS_REGION: eu-west-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "${API_PORT:-3000}:3000"
    volumes:
      - ./apps/backend:/workspace/apps/backend
      - backend_node_modules:/workspace/node_modules
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      queue:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 3s
      timeout: 3s
      retries: 20

  worker:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    command: npm run dev:worker
    environment: *backend-environment
    volumes:
      - ./apps/backend:/workspace/apps/backend
      - backend_node_modules:/workspace/node_modules
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      queue:
        condition: service_started

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: brain
      POSTGRES_PASSWORD: brain
      POSTGRES_DB: secondbrain
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brain -d secondbrain"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio-root
      MINIO_ROOT_PASSWORD: minio-secret
    ports:
      - "9000:9000"   # S3 API  (SDK: endpoint http://localhost:9000, forcePathStyle: true)
      - "9001:9001"   # web console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 20

  queue:
    image: softwaremill/elasticmq-native:latest
    ports:
      - "9324:9324"   # SQS-compatible API (SDK: endpoint http://localhost:9324; create queues via CreateQueue)

volumes:
  pgdata:
  miniodata:
  backend_node_modules:
  frontend_node_modules:
